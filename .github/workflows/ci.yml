name: Citeflora checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Enable the declared package manager
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression and API tests
        run: pnpm test
      - name: Type checking
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Vercel Next build
        run: pnpm build:vercel
      - name: Standalone Cloudflare API bundle
        run: pnpm build:api
      - name: Optional Sites build
        run: pnpm build
